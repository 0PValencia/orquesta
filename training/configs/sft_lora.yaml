# Config de referencia para Unsloth/TRL (el script CLI tiene prioridad)
# Modelo: pásalo al entrenar; no está fijado aquí.

model: unsloth/Qwen2.5-7B-Instruct  # Colab T4: max_seq_length 2048
data:
  train: data/train_messages.jsonl
  val: data/val_messages.jsonl
  format: messages  # chat template del tokenizer

training:
  max_seq_length: 2048  # T4/Colab; subir a 3072+ si hay VRAM
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 2.0e-4
  num_train_epochs: 3
  # Con ~50 ejemplos, 2–3 epochs bastan; vigilar val loss
  warmup_ratio: 0.05
  lr_scheduler_type: cosine
  optim: adamw_8bit
  seed: 42
  packing: false

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: none

qlora:
  load_in_4bit: true

output_dir: outputs/lora

notes:
  - Fase 1: proyectos + temas
  - Fase 2: razonamiento + mcp_google_docs (continuar LoRA; ver FASE2.md)
  - Dataset pequeño: riesgo alto de overfitting; preferir early stop / pocas epochs
